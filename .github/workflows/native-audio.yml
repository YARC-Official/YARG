name: Native audio

on:
  pull_request:
    paths:
      - "Native/YargAudio/**"
      - "Assets/Plugins/YargAudio/**"
      - "scripts/NativeBuild/**"
      - ".github/workflows/native-audio.yml"
  push:
    branches: [dev]
    paths:
      - "Native/YargAudio/**"
      - "Assets/Plugins/YargAudio/**"
      - "scripts/NativeBuild/**"
      - ".github/workflows/native-audio.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    name: Windows x64
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
          submodules: recursive
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.x
      - name: Build, test, and package plugin
        run: >
          dotnet run --project scripts/NativeBuild --
          build --output "$env:RUNNER_TEMP/yarg-audio-package"
      - uses: actions/upload-artifact@v4
        with:
          name: yarg-audio-windows-x64
          path: ${{ runner.temp }}/yarg-audio-package
          if-no-files-found: error
      - name: Verify committed plugin
        run: dotnet run --project scripts/NativeBuild -- build --verify-committed-plugin

  linux:
    name: Linux x64
    # Build inside an Ubuntu 20.04 container (glibc 2.31, gcc 11) to keep the
    # glibc floor at 2.31, matching Unity 6's Ubuntu 20.04 support. Toolchains
    # linked against glibc >= 2.34 emit dlopen@GLIBC_2.34 and fail to load on
    # Ubuntu 20.04, Debian 11, and RHEL 8. Do not bump this container without
    # re-evaluating the floor (see Native/YargAudio/README.md).
    runs-on: ubuntu-22.04
    container: ubuntu:20.04
    env:
      # apt can hang on debconf prompts (e.g. tzdata) in bare containers.
      DEBIAN_FRONTEND: noninteractive
    steps:
      - name: Install toolchain (gcc 10, cmake, git-lfs)
        timeout-minutes: 10
        run: |
          apt-get update
          # gcc-10 ships in focal universe and supports C++20 (designated
          # initializers, etc.); avoids the launchpad PPA keyserver.
          apt-get install -y --no-install-recommends \
            g++-10 git-lfs python3-pip curl ca-certificates libicu66 make \
            file binutils
          update-alternatives --install /usr/bin/gcc gcc /usr/bin/gcc-10 100
          update-alternatives --install /usr/bin/g++ g++ /usr/bin/g++-10 100
          # Ubuntu 20.04 ships cmake 3.16; YargAudio requires >= 3.25.
          # py3-none wheel bundles a fresh cmake; pinned <4 for preset compat.
          pip3 install --no-cache-dir "cmake<4"
          cmake --version
          gcc --version | head -1
      - uses: actions/checkout@v4
        with:
          lfs: true
          submodules: recursive
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.x
      - name: Build, test, and package plugin
        run: >
          dotnet run --project scripts/NativeBuild --
          build --output "$RUNNER_TEMP/yarg-audio-package"
      - name: Verify architecture and exports
        run: |
          file Native/YargAudio/build/linux-x64/libyarg_audio.so | grep 'ELF 64-bit.*x86-64'
          nm -D --defined-only Native/YargAudio/build/linux-x64/libyarg_audio.so | grep ' yarg_gain_dsp_attach$'
      - uses: actions/upload-artifact@v4
        with:
          name: yarg-audio-linux-x64
          path: ${{ runner.temp }}/yarg-audio-package
          if-no-files-found: error
      - name: Verify committed plugin
        run: dotnet run --project scripts/NativeBuild -- build --verify-committed-plugin

  macos:
    name: macOS universal
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
          submodules: recursive
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.x
      - name: Build, test, and package plugin
        run: >
          dotnet run --project scripts/NativeBuild --
          build --output "$RUNNER_TEMP/yarg-audio-package"
      - name: Verify architectures and exports
        run: |
          lipo Native/YargAudio/build/macos-universal/libyarg_audio.dylib -verify_arch x86_64 arm64
          nm -gU Native/YargAudio/build/macos-universal/libyarg_audio.dylib | grep ' _yarg_gain_dsp_attach$'
      - uses: actions/upload-artifact@v4
        with:
          name: yarg-audio-macos-universal
          path: ${{ runner.temp }}/yarg-audio-package
          if-no-files-found: error
      - name: Verify committed plugin
        run: dotnet run --project scripts/NativeBuild -- build --verify-committed-plugin
