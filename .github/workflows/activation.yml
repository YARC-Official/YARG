# Minta file aktivasi lisensi Unity (sekali saja, lalu tukar ke .ulf)
#
# 1. Jalankan workflow ini (Actions -> "Acquire Unity License" -> Run workflow).
# 2. Unduh artefak .alf yang dihasilkan.
# 3. Buka https://license.unity3d.com/manual, upload .alf, unduh .ulf.
# 4. Repo -> Settings -> Secrets and variables -> Actions -> New secret:
#      UNITY_LICENSE   = isi lengkap file .ulf
#      UNITY_EMAIL     = email akun Unity (personal, gratis)
#      UNITY_PASSWORD  = password akun Unity
# 5. Setelah itu workflow android-build.yml bisa jalan.
name: Acquire Unity License

on:
  workflow_dispatch:

jobs:
  activation:
    name: Request manual activation file
    runs-on: ubuntu-latest
    steps:
      - name: Request activation file
        id: getManualLicenseFile
        uses: game-ci/unity-request-activation-file@v2
        with:
          unityVersion: 6000.3.5f1

      - name: Expose as artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.getManualLicenseFile.outputs.filePath }}
          path: ${{ steps.getManualLicenseFile.outputs.filePath }}
